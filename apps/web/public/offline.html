<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#171a18" />
    <title>Sin conexión | cobranzapp</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f3f5f3; color: #171a18; font-family: system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #dfe4df; border-radius: 20px; background: white; box-shadow: 0 20px 60px rgb(21 24 23 / .1); }
      i { display: block; width: 42px; height: 6px; margin-bottom: 28px; border-radius: 99px; background: #fbbf24; }
      h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -.04em; }
      p { margin: 0 0 24px; color: #68706a; line-height: 1.55; }
      a { display: grid; width: 100%; min-height: 48px; place-items: center; border: 0; border-radius: 12px; background: #171a18; color: white; font: inherit; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <i aria-hidden="true"></i>
      <h1>Sin conexión</h1>
      <p>Conéctate a internet para consultar información actualizada o registrar movimientos.</p>
      <a href="/ingresar">Intentar nuevamente</a>
    </main>
  </body>
</html>
