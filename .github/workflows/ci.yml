name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.7-alpine3.23
        env:
          POSTGRES_DB: cobranzapp_test
          POSTGRES_USER: cobranzapp_owner
          POSTGRES_PASSWORD: owner-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cobranzapp_owner -d cobranzapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://cobranzapp_owner:owner-test-password@localhost:5432/cobranzapp_test
      APP_DATABASE_USER: cobranzapp_app
      APP_DATABASE_PASSWORD: integration-app-password-123456
      WORKER_DATABASE_USER: cobranzapp_worker
      WORKER_DATABASE_PASSWORD: integration-worker-password-123456
      TEST_DATABASE_URL: postgresql://cobranzapp_app:integration-app-password-123456@localhost:5432/cobranzapp_test
      TEST_WORKER_DATABASE_URL: postgresql://cobranzapp_worker:integration-worker-password-123456@localhost:5432/cobranzapp_test
      TEST_MIGRATION_DATABASE_URL: postgresql://cobranzapp_owner:owner-test-password@localhost:5432/cobranzapp_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:check
      - run: pnpm db:migrate
      - run: pnpm check
